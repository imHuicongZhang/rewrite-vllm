# configs/data.yaml -- THE WORKLOAD. Wytro fills this in before handoff.
#
# The blanks below are Wytro's to fill. Everything NOT marked is fixed by the workload
# specification or copied from the source pipeline and must not be edited.
#
# Five arms, two prompts each. Every arm is rewritten.
#
#   arm                  prompts   rewrite jobs   source tokens (llama-2)
#   quality-first           2         2                 60.0 B
#   diversity-oriented      2         2                 60.0 B
#   disagreement-aware      2         2                 60.0 B
#   wrap-inspired           2         2                 60.0 B
#   rewire-inspired         2         2                120.0 B
#                                    10                360.0 B
#
# ---------------------------------------------------------------------------------------
# WHICH TOKENS GO THROUGH THE GPU, AND WHICH DO NOT
#
# The corpus is built half+half: a shared RAW CORE plus a block-specific REMAINDER.
# Only the remainder is rewritten. This pipeline downloads and processes remainders ONLY.
#
#   THROUGH THE GPU        360.0 B source tokens x 2 passes = 720.0 B input tokens
#                          -> 261.5 B output tokens (measured; see est_output_tokens below)
#
#   NEVER THROUGH A GPU     70.0 B tokens, NOT downloaded by this pipeline:
#     shared-core    20,000,010,702 tok   17,909,083 docs
#         The raw half. Carried into training by all five arms above, byte-identical in
#         each (proven by sha256 at 02_select/select_600m.py:631-637). It lives on the Hub
#         at Know-Your-Sources-7B/shared-core/ and is joined back on doc_id downstream.
#         Rewriting it would be five-times-redundant work, so it is not rewritten at all.
#     quality-base   50,000,002,028 tok   37,298,288 docs
#         The raw-text CONTROL block. Never rewritten and NEVER UPLOADED -- it exists only
#         at datasets/rewrite/01_before_rw/quality-base/ (02_select/upload_blocks.py:15-16:
#         "has no place in a repo whose purpose is to feed the rewriting stage").
#
#   Both are recorded here as a COMMENT and not as arms, deliberately: neither consumes GPU
#   time, and downloading 20 B raw core tokens onto the run machine would cost bandwidth and
#   disk for nothing. preflight, the manifest and the job enumeration all ignore them.
#   Whoever assembles the final training mixes needs both; nothing here produces or moves them.
#
#   Token convention throughout: tokens-llama2 + 1 (one leading BOS), per
#   02_select/select_600m.py:136,273.
#
# THE 50B INVARIANT -- the constraint the half+half structure exists to satisfy.
#
#   Every arm lands at 50B FINAL TRAINING tokens.
#     quality-base    = 50B raw                       (top-50B prefix of the ftq order)
#     every other arm = 20B raw core + 30B rewritten  = 50B
#   Source: select_600m.py:78-79,358 (quality-base's 50B is stated as a final_training
#   budget); 02_select/README.md (quality-base is the top-50B prefix, the core is the
#   top-20B prefix of the SAME order, so quality-base already contains the core).
#
#   The remainder budgets below are SOURCE budgets and over-produce on purpose; the
#   surplus is trimmed to 30B downstream ("Expect ~36B out of 60B and trim to budget,
#   as at 1.5B" -- select_600m.py:122). Produced vs needed:
#
#     arm                  source   produced   needed   headroom
#     quality-first          60B     35.88B      30B     +19.6%   <- tightest
#     diversity-oriented     60B     39.94B      30B     +33.1%
#     disagreement-aware     60B     38.40B      30B     +28.0%
#     wrap-inspired          60B     47.82B      30B     +59.4%
#     rewire-inspired       120B     99.46B      30B     +231%    <- roomiest
#
#   Every arm clears its budget, and each ratio reproduces the 1.5B run's headroom exactly
#   (budgets scaled 6x and r was carried over). But see the precision caveat below.
#
# PRECISION OF THESE ESTIMATES. r was measured on the 1.5B corpora and transferred to
# these remainders, which are a DIFFERENT document population -- core-excluded, and with
# very different mean document length across arms (~1,600 tok/doc for quality-first vs
# ~949 for wrap/rewire). Treat the totals as ~260B +/- 10%, not as five significant
# figures. quality-first's +19.6% headroom sits inside that band: if r comes in ~16% low,
# that arm goes short of 30B. scripts/06_calibrate.py cross-checks measured tok/doc against
# these numbers on the first job -- read it. Full argument: docs/DESIGN_DELTA.md s10.3.
# ---------------------------------------------------------------------------------------
#
# SEMANTICS -- the thing that is easiest to get wrong:
# EVERY PROMPT COVERS EVERY DOCUMENT OF ITS ARM EXACTLY ONCE. Output row count per
# (arm, prompt) must equal the arm's input row count, or the job fails. That holds for all
# ten jobs, including wrap-inspired's styled pass, which covers every document once using
# ONE OF FOUR styles per document rather than one fixed prompt. See `styles:` below.

expected_jobs: 10          # hard-asserted against the enumeration below

semantics:
  # Enforced by rewrite.data.verify_job(): sum(n_rows_out) == manifest.total_rows, per job.
  # Every document is rewritten exactly once per prompt. A prompt is never partitioned
  # across documents, never sampled, never round-robined.
  full_coverage: true

# ---------------------------------------------------------------------------------------
# GPU ARCHITECTURE CONSTRAINT -- Wytro's decision, not Tianjian's. Not a placeholder.
#
# All 10 jobs run on Blackwell only: B200 (sm_100) and B300 / Blackwell Ultra (sm_103).
# H200 (Hopper, sm_90) is deliberately EXCLUDED even if present on the node.
#
# THE REASON, stated correctly. An earlier version of this comment argued that Blackwell
# was chosen to stay close to the source data. That is backwards, and anyone deciding
# whether to swap hardware later needs the real reason rather than one that points the
# wrong way:
#
#   1. ONE ARCHITECTURE FAMILY ACROSS ALL TEN JOBS. Non-negotiable, and sufficient on its
#      own. Greedy decoding at temperature=0 is not bitwise identical across architectures
#      -- vLLM selects a different attention backend, and an argmax can flip on a near-tie
#      after which that generation diverges. Mixing families across the ten jobs would
#      confound "which arm" with "which GPU", which is exactly the comparison this
#      experiment exists to make. Restricting to one family removes the confound entirely.
#
#   2. BLACKWELL CHOSEN FOR THROUGHPUT -- roughly 2-3x Hopper on this workload. That is
#      the whole of the reason it is Blackwell rather than Hopper. It is a cost decision,
#      not a fidelity one.
#
#   3. THE ACCEPTED COST. The 1.5B corpora were generated on H100 with FlashAttention v3,
#      which is Hopper-only. H100 and H200 are both sm_90 and share that path, so H200 is
#      in fact the architecture CLOSEST to how the source data was produced -- excluding it
#      moves this run further from the source's numerics, not nearer. We accept that: this
#      run is NOT numerically continuous with the 1.5B run, and it was never going to be
#      across a GPU generation change (the vLLM version differs too). Cross-scale
#      comparability rests on matching prompts, budgets and selection procedure -- all of
#      which are verified -- not on bitwise-identical generation.
#
# B200 and B300 are both Blackwell, so they share an attention backend and their numerics
# are close; the residual difference between sm_100 and sm_103 is accepted, and every
# shard records which card produced it (gpu_cc in its .done sidecar) either way.
#
# preflight.py refuses to start, and every worker refuses to run, on a GPU outside this
# set. Do not widen it to work around a hardware problem -- ask Wytro.
compute_constraints:
  allowed_gpu_arch: [sm_100, sm_103]      # B200, B300
  # A card whose exact capability is not listed but whose MAJOR version is in this list is
  # allowed with a warning. That covers a Blackwell variant reporting e.g. sm_101 without
  # silently letting a Hopper (major 9) or Ada (major 8) card in.
  allowed_gpu_arch_major: [10]
  reason: "Blackwell only (B200/B300); H200 excluded to avoid confounding arm with GPU architecture"

# ---------------------------------------------------------------------------------------
# THE INPUT DATASET -- one gated HuggingFace repo with internal folder structure.
#
# NOT six flat repos. Each arm below names a `subdir`, and the loader addresses it by an
# explicit data_files glob. It does NOT use HF config names, on purpose: the Hub card for
# this dataset declares no `configs:` block, so the auto-converter reports a single config
# `default`/`train` that globs EVERY folder. load_dataset(repo_id) would therefore silently
# mix shared-core into all five arms and inflate each by 17.9M rows.
#
# ACCESS: this repo is gated (extra_gated_review: manual). Tianjian's HF account must be
# granted access before step 2 will download anything. preflight check 3 verifies this and
# fails with an actionable message rather than letting the run die partway through.
# ---------------------------------------------------------------------------------------
hf:
  repo_id: wytro/Know-Your-Sources-7B      # source: 02_select/upload_blocks.py:67
  # Pinned so a later push to the dataset cannot change what this run consumed halfway
  # through. Verified against the Hub 2026-08-25.
  revision: 6e18cda64fbd24fe46010b2aa578f14a4255076d
  # Substituted with each arm's `subdir`. The uploaded parquet carries 34 columns; this
  # pipeline reads only doc_id and text and ignores the other 32, which can be joined back
  # later on doc_id.
  data_files_template: "{subdir}/data/*.parquet"

sharding:
  text_column: text

  # DECIDE shard_target_rows BEFORE JOB 1 AND DO NOT CHANGE IT.
  # It feeds the manifest fingerprint, so changing it after generation has started
  # renumbers doc_id and invalidates every .done marker -- i.e. throws the run away.
  #
  # A shard is the unit of work, of resume, and of the row-conservation proof, so its
  # size trades tail-idle against per-shard overhead AND against filesystem metadata load.
  #
  # Round 3 chose 2000 because the smallest arm then had 5,602,476 docs, where 10,000-row
  # shards gave only 561 shards and FAILED the min_shards_per_gpu guard at 100 GPUs. The
  # smallest remainder is now 33,381,230 docs -- 6x larger -- so that failure mode is gone
  # and every candidate passes with room. Recomputed against the real counts:
  #
  #   rows    input shards   output files   smallest arm   ratio @100 GPU   tail
  #    2000       147,955        591,820         16,691         167:1       ~2 min
  #    5000        59,184        236,736          6,677          67:1       ~6 min  <- chosen
  #   10000        29,594        118,376          3,339          33:1      ~11 min
  #   16000        18,497         73,988          2,087          21:1      ~18 min
  #
  # 5000 is the choice. At 2000 the run creates 147,955 input shards and ~592k output files
  # -- 63,241 shards for rewire-inspired alone -- which is heavy metadata load on a shared
  # filesystem to save four minutes of tail per job.
  #
  # It stays an explicit constant rather than being derived from num_gpus, for the round-3
  # reason that still holds: num_gpus lives in Tianjian's cluster.yaml, while shard size
  # feeds the fingerprint. Deriving one from the other would let a machine-local setting
  # silently renumber doc_id.
  #
  # ---------------------------------------------------------------------------------
  # THIS CAPS THE RUN AT ~330 GPUs. Check the fleet size against it BEFORE job 1.
  #
  #   max_gpus = ceil(docs / shard_target_rows) / min_shards_per_gpu,
  #              taken over the SMALLEST arm, which is the binding one
  #
  #     arm                        docs    shards @5000   max GPUs
  #     disagreement-aware   33,381,230           6,677        333   <- binding
  #     diversity-oriented   35,304,301           7,061        353
  #     quality-first        37,511,431           7,503        375
  #     wrap-inspired        63,226,477          12,646        632
  #     rewire-inspired     126,480,544          25,297      1,264
  #
  # Above ~333 GPUs, 02_download_data.py refuses to shard disagreement-aware and prints
  # the shard_target_rows to use instead. The remedy is re-sharding, which changes the
  # manifest fingerprint and therefore invalidates every .done marker -- i.e. in practice
  # it means re-preparing the data from scratch. Decide before job 1.
  #
  # Re-derive rather than re-guess if anything changes: a different min_shards_per_gpu, a
  # different shard_target_rows, or an arm whose doc count moves all shift this number.
  # ---------------------------------------------------------------------------------
  shard_target_rows: 5000

  # Secondary cap, so one run of very long documents cannot become a multi-hour shard.
  shard_target_bytes: 268435456     # 256 MiB of raw UTF-8 text

  # Shards must comfortably outnumber workers or the tail of each job idles the fleet.
  # The source ran 200 shards over 8 workers (25:1). 02_download_data.py refuses below
  # this and tells you what to set shard_target_rows to.
  min_shards_per_gpu: 20

  # doc_id is the key that joins rewritten output back to the input corpus, and the key
  # that reassembles the rewritten remainder with the raw shared-core half. The uploaded
  # parquet carries it (int64, globally unique across the 600M-document corpus, stable
  # across blocks), so this will resolve to doc_id_source: dataset for all five arms.
  #
  # Set false ONLY if a dataset genuinely cannot supply one; the fallback is a synthesized
  # row index, which is deterministic but ties the join to data_root/shards/ surviving.
  # Whichever applies is recorded per arm in the manifest as doc_id_source AND folded into
  # the fingerprint, because flipping this renumbers every row.
  #
  # NOTE on uniqueness: doc_id is unique WITHIN an arm's remainder (asserted upstream), but
  # NOT across arms -- remainders are drawn from the same core-excluded pool by different
  # criteria, so the same document can appear in several arms. That is expected and
  # harmless: the downstream join key is (doc_id, arm, prompt_id), which the output rows
  # carry. Do not add a cross-arm disjointness check here; it belongs upstream at
  # 13_600M/02_select where the id arrays are local.
  require_doc_id: true

output:
  format: jsonl
  # The 11 keys written per row. status and n_output_tokens_llama2 are beyond the 8-key
  # spec because the ported trim logic filters on status==2 and the token budget is
  # counted in Llama-2 tokens, exactly as the source did.
  #
  # wrap_style carries the per-document style for wrap-inspired's styled pass and is the
  # EMPTY STRING for the other nine jobs. The source added this column only in wrap mode
  # (07_rewrite/rewrite_worker.py:316-323); here it is present in every row of every job so
  # the ten output sets share one schema. Without it the style assignment is unrecoverable
  # after the fact.
  keys: [doc_id, arm, prompt_id, source_text_sha1, rewritten_text, finish_reason,
         n_prompt_tokens, n_output_tokens, status, n_output_tokens_llama2, wrap_style]
  # Sizing model used by scripts/preflight.py for its free-disk check. Stated here so the
  # estimate is auditable rather than magic:
  #   bytes ~= bytes_per_output_token * output_tokens + bytes_per_row_overhead * rows
  # 4.2 B/token = ~3.8 chars/token of UTF-8 English + ~10% JSON string escaping.
  # 235 B/row  = the JSON envelope (keys, doc_id, 40-char sha1, counts, punctuation),
  #              raised from 220 for the wrap_style key.
  bytes_per_output_token: 4.2
  bytes_per_row_overhead: 235
  # There is no est_output_tokens_per_arm scalar any more. The real per-arm figures span
  # 35.9B to 99.5B -- a 2.8x spread -- so a single number cannot express them. Each arm
  # carries its own est_output_tokens, measured; preflight sums them.

shuffle:
  # All three copied from the source (pp_io.py / 03_mix_shared_top.py). Do not change:
  # the seed and rows_per_shard define the output, and inflate feeds the bucket-count
  # formula that keeps the shuffle inside RAM.
  seed: 42
  rows_per_shard: 500000
  inflate: 4.0
  # Shuffling is within (arm, prompt) ONLY -- never across arms.
  scope: arm_prompt

postprocess:
  # Source parity: the source trimmed shards in place via atomic .tmp + os.replace.
  # Set false to write to out_root/trimmed/ instead, at the cost of a second full copy.
  in_place: true

upload:
  # One repo per (arm, prompt) = 10 repos. {arm} and {prompt_id} are substituted.
  repo_template: "<<<WYTRO: output HF repo id template, e.g. your-org/rewrite-{arm}-{prompt_id}>>>"
  private: true
  stage: shuffled            # raw | trimmed | shuffled

# ---------------------------------------------------------------------------------------
# Prompt definitions. The four fields carry the source's per-prompt asymmetry; the prompt
# TEXT lives in prompts/<arm>/<file> and is byte-identical to the source.
#
#   mode              grounded   -> prompt.replace("[TEXT]", doc)   (source: build_content)
#                     wrap_multi -> one of `styles` per document, chosen by seeded RNG;
#                                   style prompt + doc  (style prompt ends "\n\nPassage:\n")
#   trim              which ported trim rule applies (docs/POSTPROCESSING.md)
#   input_drop        status=0 threshold on the TEMPLATED token count.
#                     null => derived as max_model_len - max_tokens = 28672, so every kept
#                     doc gets the full 4096-token output budget (source: 09_Distill).
#   expected_overhead empty-document chat-templated token count. A PARITY GATE: preflight
#                     asserts it, so a changed prompt/template/tokenizer is caught before
#                     any GPU time is spent. For wrap_multi it is per style, and all four
#                     are asserted.
# ---------------------------------------------------------------------------------------
prompt_defs:
  p1_wiki:    {mode: grounded, trim: wiki,    input_drop: 30720, expected_overhead: 150}
  p2_distill: {mode: grounded, trim: distill, input_drop: null,  expected_overhead: 185}

  # wrap-inspired's styled pass. ONE job, FOUR prompts, one chosen per document.
  #
  # Style assignment is np.random.default_rng([42, shard_index]).integers(0, 4, n_rows),
  # verbatim from 07_rewrite/rewrite_worker.py:54-62 -- see src/rewrite/wrap_styles.py.
  # It is keyed ONLY by (42, shard_index), never by worker id or claim order, so a worker
  # restarting shard N reproduces the identical assignment. THE ORDER OF `styles` BELOW IS
  # PART OF THE SEED: the RNG draws an index into it. Reordering these four entries
  # silently changes which document gets which style.
  #
  # trim and input_drop are uniform across the four styles; only the text and the
  # empty-document overhead differ.
  wrap_styled:
    mode: wrap_multi
    trim: wrap
    input_drop: 30720
    styles:
      - {style: easy, file: prompts/wrap-inspired/style_easy.txt, expected_overhead: 72}
      - {style: hard, file: prompts/wrap-inspired/style_hard.txt, expected_overhead: 66}
      - {style: wiki, file: prompts/wrap-inspired/style_wiki.txt, expected_overhead: 73}
      - {style: qa,   file: prompts/wrap-inspired/style_qa.txt,   expected_overhead: 83}

# ---------------------------------------------------------------------------------------
# The five arms.
#
# Each carries the measured numbers so the workload is auditable from this file alone:
#   docs / source_tokens_llama2  the REMAINDER as uploaded -- what the GPU consumes.
#                                Source: <subdir>/stats.json on the Hub, cross-checked
#                                against 02_select/select_600m.py:77-83 budgets.
#   r                            measured output/input token ratio for that prompt, in
#                                llama-2 tokens. Census-exact, from the 1.5B run's
#                                07_rewrite/progress/*.json and 09_Distill/progress/*.json.
#                                Validated: r_p1 + r_p2 reproduces the yields recorded
#                                independently at 02_select/select_600m.py:114-123
#                                (0.598 / 0.640 / 0.666 / 0.797 / 0.829) to 3 decimals.
#   est_output_tokens            source_tokens_llama2 * r. Feeds the preflight disk check.
#
# Full derivation, and what happened to the outputs these were measured from:
# docs/DESIGN_DELTA.md section 5.
# ---------------------------------------------------------------------------------------
arms:
  - name: quality-first
    subdir: quality-first
    docs: 37511431
    source_tokens_llama2: 60000000654
    prompts:
      - {id: p1, file: prompts/quality-first/p1.txt, def: p1_wiki,
         r: 0.3399, est_output_tokens: 20394000222}
      - {id: p2, file: prompts/quality-first/p2.txt, def: p2_distill,
         r: 0.2581, est_output_tokens: 15486000169}

  - name: diversity-oriented
    subdir: diversity-oriented
    docs: 35304301
    source_tokens_llama2: 60000039601
    prompts:
      - {id: p1, file: prompts/diversity-oriented/p1.txt, def: p1_wiki,
         r: 0.3812, est_output_tokens: 22872015096}
      - {id: p2, file: prompts/diversity-oriented/p2.txt, def: p2_distill,
         r: 0.2845, est_output_tokens: 17070011266}

  - name: disagreement-aware
    subdir: disagreement-aware
    docs: 33381230
    source_tokens_llama2: 60000014390
    prompts:
      - {id: p1, file: prompts/disagreement-aware/p1.txt, def: p1_wiki,
         r: 0.3649, est_output_tokens: 21894005250}
      - {id: p2, file: prompts/disagreement-aware/p2.txt, def: p2_distill,
         r: 0.2750, est_output_tokens: 16500003957}

  # -------------------------------------------------------------------------------------
  # wrap-inspired: ONE styled pass + the shared distill pass. NOT four style passes.
  #
  # p1 assigns one of easy/hard/wiki/qa per document (see prompt_defs.wrap_styled) and
  # records the choice in the wrap_style output column. p2 is the same distill prompt every
  # other arm runs -- byte-identical, md5 538700534e99d5e80b268fd9b2408b48.
  # This is what the source did: 02_select/README.md, "wrap-inspired follows the 1.5B arm
  # exactly: pass 1 is the 4-style assignment with one style per document ... pass 2 is the
  # shared distill prompt -- 2 rewrites per document, the same rewrite cost as every other
  # setting."
  #
  # INHERITED ASYMMETRY, for whoever cuts this arm to a token budget. Uniform PER-DOCUMENT
  # assignment balances documents but NOT tokens, because the styles expand very
  # differently. Measured at 1.5B (10_postprocess/_step2_wrap_summary.json):
  #
  #     style   doc share   token share   tok/doc
  #     easy      25.05%       14.23%      223.5
  #     hard      24.91%       33.55%      529.8
  #     wiki      25.03%       23.16%      364.0
  #     qa        25.02%       29.05%      456.7
  #
  # Documents are balanced to 25.0% +/- 0.1pp; tokens spread 2.37x. The source applied no
  # correction and neither does this pipeline. But a uniform TOKEN draw is not a uniform
  # STYLE draw -- if that matters, stratify on the wrap_style column.
  #
  # (The previous four-pass "4 copies per document" caveat is gone with the four-pass
  # design. See docs/DESIGN_DELTA.md section 2.)
  # -------------------------------------------------------------------------------------
  - name: wrap-inspired
    subdir: wrap-inspired
    docs: 63226477
    source_tokens_llama2: 60000001229
    prompts:
      - {id: p1, file: null, def: wrap_styled,
         r: 0.4313, est_output_tokens: 25878000530}
      - {id: p2, file: prompts/wrap-inspired/p2.txt, def: p2_distill,
         r: 0.3657, est_output_tokens: 21942000449}

  # rewire-inspired carries kappa = 2 on the REMAINDER (120B, not 60B) -- not 2x on the
  # block total. Source: 02_select/select_600m.py:19-20,81.
  #
  # ---------------------------------------------------------------------------------
  # THE POST-REWRITE FILTER IS NOT IMPLEMENTED HERE. Read this before running it.
  #
  # The kappa=2 headroom exists to feed a filter that scores the REWRITTEN text with
  # fastText and fills to this arm's 30B training budget. This pipeline does not do that,
  # so the arm ships ~99.5B output tokens UNFILTERED and someone must cut them to 30B
  # before they enter a training mix.
  #
  # It is a FIXED-BUDGET FILL, not "the top half" and not a fixed score threshold.
  # 10_postprocess/_step4_rewrite_summary.json at 1.5B, verbatim:
  #     pipeline: "rewrite broadly -> fasttext score rewritten -> keep top 5B"
  #     selection_note: "... token-budget-matched top-5B (NOT the paper top-10%)"
  #     pool_tokens 16,221,811,013 -> kept_tokens 5,000,000,351   (30.8% retained)
  #     target 5,000,000,000   overshoot 351   filled true
  #     fasttext_score_cutoff 0.1145634651184082
  # The cutoff is the OUTPUT of filling to the target, not an input. Do not port 0.11456
  # as a constant: the 600M rewritten text is a different population, so its score
  # distribution will differ, and a budget fill self-corrects where a threshold does not.
  # RECOMMENDED (not decided): fill_to(order_by_fasttext_desc, tokens, 30e9), and record
  # the realized cutoff and retained fraction the way _step4 did.
  #
  # Headroom is comfortable, not tight: 30B needed / 99.5B produced = 30.2% required
  # retention, against 30.8% realized at 1.5B -- kappa=2 was sized so the pool-to-budget
  # ratio carries over (3.32x here, 3.24x there). This is the ROOMIEST of the five arms.
  # The tightest is quality-first at +19.6%. See docs/DESIGN_DELTA.md section 6.
  # ---------------------------------------------------------------------------------
  - name: rewire-inspired
    subdir: rewire-inspired
    docs: 126480544
    source_tokens_llama2: 120000000593
    prompts:
      - {id: p1, file: prompts/rewire-inspired/p1.txt, def: p1_wiki,
         r: 0.4628, est_output_tokens: 55536000274}
      - {id: p2, file: prompts/rewire-inspired/p2.txt, def: p2_distill,
         r: 0.3660, est_output_tokens: 43920000217}
